name: CI/CD Reticle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: "21"
  JAVA_DISTRIBUTION: "temurin"
  NODE_VERSION: "24"

jobs:
  backend-test-and-deploy:
    name: Backend Java - Test & Deploy (Render)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run tests with Maven
        run: mvn verify --batch-mode --no-transfer-progress
        env:
          DATABASE_URL: "jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1"
          DB_PASSWORD: "test"
          SPRING_PROFILES_ACTIVE: "test"

      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

      - name: Validate Docker build (Render dry-run)
        run: docker build -t dev-trends-backend:test .

      - name: Trigger Render Deploy
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set; skipping Render deploy."
            exit 0
          fi

          echo "Triggering Render deploy..."
          HTTP_STATUS=$(curl --silent --output /dev/null \
            --write-out "%{http_code}" \
            --max-time 30 \
            --request POST \
            "$RENDER_DEPLOY_HOOK_URL")

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Render deploy triggered successfully (HTTP $HTTP_STATUS)"
          else
            echo "Failed to trigger Render deploy (HTTP $HTTP_STATUS)"
            exit 1
          fi

  frontend-build-and-deploy:
    name: Frontend Next.js - Build & Deploy (Vercel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    # Secrets live in job-level env with empty-string fallbacks so the deploy
    # step's `if` can check them without tripping the workflow-file parse path.
    #
    # On pull requests the build points at a closed local port instead of the
    # real backend: the E2E suite stubs every client call, but server-rendered
    # pages (e.g. /topic/[id]) fetch at request time and would otherwise hang
    # on a cold Render instance past the test timeout.
    env:
      NEXT_PUBLIC_API_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:9' || secrets.NEXT_PUBLIC_API_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: TypeScript type check
        run: npm run type-check

      - name: Build Next.js
        run: npm run build

      - name: Install Playwright browsers
        if: github.event_name == 'pull_request'
        run: npm run test:e2e:install

      - name: Playwright a11y and E2E tests
        if: github.event_name == 'pull_request'
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      # The amondnet/vercel-action requires a local .vercel link (project.json),
      # which this repo does not have. Vercel's native GitHub integration already
      # handles the production deploy, so we keep that and disable this manual
      # step to avoid the two systems racing each other. If the native
      # integration is ever turned off, uncomment this block and commit a
      # `.vercel/project.json` so the action can resolve the project.
      # - name: Deploy to Vercel
      #   if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.VERCEL_TOKEN != ''
      #   uses: amondnet/vercel-action@v25
      #   with:
      #     vercel-token: ${{ env.VERCEL_TOKEN }}
      #     vercel-org-id: ${{ env.VERCEL_ORG_ID }}
      #     vercel-project-id: ${{ env.VERCEL_PROJECT_ID }}
      #     working-directory: ./frontend
      #     vercel-args: "--prod"

  # Single required check for branch protection on main: it passes only when
  # every job above succeeded, so the ruleset doesn't need to track job names.
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [backend-test-and-deploy, frontend-build-and-deploy]
    if: always()

    steps:
      - name: Require every CI job to succeed
        run: |
          BACKEND_STATUS="${{ needs.backend-test-and-deploy.result }}"
          FRONTEND_STATUS="${{ needs.frontend-build-and-deploy.result }}"
          echo "Backend:  $BACKEND_STATUS"
          echo "Frontend: $FRONTEND_STATUS"
          if [ "$BACKEND_STATUS" != "success" ] || [ "$FRONTEND_STATUS" != "success" ]; then
            echo "CI gate failed: every job must succeed before merging."
            exit 1
          fi

  notify-status:
    name: Notify Deploy Status
    runs-on: ubuntu-latest
    needs: [backend-test-and-deploy, frontend-build-and-deploy]
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Pipeline completed
        run: |
          BACKEND_STATUS="${{ needs.backend-test-and-deploy.result }}"
          FRONTEND_STATUS="${{ needs.frontend-build-and-deploy.result }}"

          echo "============================================"
          echo "  Reticle - Deploy Summary"
          echo "============================================"
          echo "  Backend  (Render): $BACKEND_STATUS"
          echo "  Frontend (Vercel): $FRONTEND_STATUS"
          echo "============================================"
